<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1080" viewBox="0 0 2100 1080" role="img" aria-labelledby="title desc">
<title id="title">Java 集合框架：接口、实现类与相关工具</title>
<desc id="desc">Collection 继承 Iterable，分为 List、Queue 和 Set；Map 为独立分支。图中包含常用实现、迭代器、Map 集合视图、比较接口及工具类。实线空心三角表示继承，虚线空心三角表示实现（含通过父类继承的实现），点线箭头表示关联。省略抽象基类和并发集合。</desc>
