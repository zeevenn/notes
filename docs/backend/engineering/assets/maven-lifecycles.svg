<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1300" viewBox="0 0 1254 1300" role="img" aria-labelledby="title desc">
<title id="title">Maven 三个生命周期及其完整阶段</title>
<desc id="desc">clean、default、site 为三个独立的生命周期。default 的 validate、compile、test、package、verify、install、deploy 横向排列，各相邻常用阶段之间的步骤在同一列中依次展开。图中列出全部 30 个阶段，蓝色节点为正文解释的 9 个常用阶段。</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #24344c; }
    .panel { fill: #f8fafc; stroke: #dbe3ed; stroke-width: 1.5; }
    .heading { font-size: 28px; font-weight: 650; }
    .subtitle { font-size: 22px; fill: #506079; }
    .phase rect { fill: #fff; stroke: #cbd5e1; stroke-width: 1.4; }
    .phase text { font-size: 22px; text-anchor: middle; }
    .common rect { fill: #e8f1ff; stroke: #6289c0; stroke-width: 1.7; }
    .common text { fill: #214f87; font-weight: 650; }
    .edge { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); stroke-linejoin: round; }
  </style>
</defs>
